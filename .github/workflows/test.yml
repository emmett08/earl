name: EAL tests
on:
  workflow_dispatch:
    inputs:
      model_transfer:
        description: 'Run the selected live nano-model plan (API budget at most USD 2)'
        type: boolean
        default: false
      model_transfer_plan:
        description: 'Principal, reasoning or evidence-cadence pilot; each has a USD 2 ceiling'
        type: choice
        options:
          - comparison
          - diagnostics
          - cadence
          - cadence-diagnostics
        default: comparison
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check parser, tests and maintained example
        run: make check
      - name: Build distribution
        run: make build
  model-transfer:
    if: ${{ inputs.model_transfer }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run the bounded live pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSFER_PLAN: ${{ inputs.model_transfer_plan }}
        run: |
          case "$TRANSFER_PLAN" in
            comparison) plan_file=experiments/model_transfer/plan.json ;;
            diagnostics) plan_file=experiments/model_transfer/diagnostic-plan.json ;;
            cadence) plan_file=experiments/model_transfer/cadence-plan.json ;;
            cadence-diagnostics) plan_file=experiments/model_transfer/cadence-diagnostic-plan.json ;;
            *) exit 2 ;;
          esac
          python -m experiments.model_transfer.runner --plan "$plan_file" --output experiments/model_transfer/runs/live
      - name: Retain every attempt and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/model_transfer/runs/live
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
