name: EAL tests
on:
  workflow_dispatch:
    inputs:
      model_transfer:
        description: 'Run an experiment stage after tests (only collect calls the API)'
        type: boolean
        default: false
      model_transfer_plan:
        description: 'Principal, reasoning or evidence-cadence pilot; each has a USD 2 ceiling'
        type: choice
        options:
          - comparison
          - diagnostics
          - cadence
          - cadence-diagnostics
          - custom
        default: comparison
      experiment_action:
        description: 'Stage: collect/resume, free rehearsal/calibration, or offline processing'
        type: choice
        options: [collect, calibrate, rehearse, export-annotations, import-annotations, analyse, plan]
        default: collect
      plan_path:
        description: 'Custom plan: repository path, or path within source artefact; ignored on resume'
        type: string
        default: ''
      source_artifact_id:
        description: 'Numeric artefact ID from this repository for resume or offline stages'
        type: string
        default: ''
      resume_run:
        description: 'Continue the frozen retained run; keep its cumulative budget and worker count'
        type: boolean
        default: false
      segment_seconds:
        description: 'Collection allowance for this job, 1–6000 seconds; remaining time saves artefacts'
        type: number
        default: 6000
      annotation_labels:
        description: 'Repository path to completed labels for import-annotations'
        type: string
        default: ''
      information_config:
        description: 'Optional repository path to prospective allocation configuration'
        type: string
        default: ''
      workers:
        description: '0 uses the plan (default 4); 1–8 overrides pilot workers; ignored for resume'
        type: number
        default: 0
permissions:
  contents: read
  actions: read
jobs:
  test:
    uses: ./.github/workflows/verify.yml
  model-transfer:
    if: ${{ inputs.model_transfer }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install package
        run: python -m pip install -c experiments/model_transfer/requirements.lock -e .
      - name: Run the selected experiment stage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSFER_PLAN: ${{ inputs.model_transfer_plan }}
          EXPERIMENT_ACTION: ${{ inputs.experiment_action }}
          PLAN_PATH: ${{ inputs.plan_path }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          RESUME_RUN: ${{ inputs.resume_run }}
          SEGMENT_SECONDS: ${{ inputs.segment_seconds }}
          ANNOTATION_LABELS: ${{ inputs.annotation_labels }}
          INFORMATION_CONFIG: ${{ inputs.information_config }}
          EXPERIMENT_WORKERS: ${{ inputs.workers }}
          GH_TOKEN: ${{ github.token }}
        run: python -m experiments.model_transfer.workflow
      - name: Retain every attempt and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/model_transfer/runs/live
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
