name: EAL tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ vars.EAL_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      TEST_IMAGE: eal-tests:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the complete test environment
        run: docker build --file experiments/api_load_test/Dockerfile --tag "$TEST_IMAGE" .
      - name: Test parser, package, example and real HTTP/MCP routes
        run: docker run --rm --network none "$TEST_IMAGE"
      - name: Remove this job's image
        if: always()
        run: docker image rm "$TEST_IMAGE" || true
