name: API load-test model experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cases per model: calibration 3, smoke 4, pilot 40; checked finalisation uses 2 arms'
        required: true
        default: calibration
        type: choice
        options: [calibration, smoke, pilot]
      model:
        description: 'Select a pinned snapshot; all runs the six-model matrix'
        required: true
        default: all
        type: choice
        options:
          - all
          - gpt-4.1-nano-2025-04-14
          - gpt-4.1-mini-2025-04-14
          - gpt-4.1-2025-04-14
          - gpt-5.4-nano-2026-03-17
          - gpt-5.4-mini-2026-03-17
          - gpt-5.4-2026-03-05
      transport:
        description: 'Text adapter by default; native is a separate diagnostic run'
        required: true
        default: text
        type: choice
        options: [text, native]
      finalisation:
        description: 'Model-authored answers or direct checked decisions (EAL and validator only)'
        required: true
        default: model
        type: choice
        options: [model, checked]

permissions:
  contents: read

concurrency:
  group: api-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    # Paid runner and model work starts only after an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.EAL_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      EXPERIMENT_MODE: ${{ inputs.mode }}
      EXPERIMENT_MODEL: ${{ inputs.model }}
      EXPERIMENT_FINALISATION: ${{ inputs.finalisation }}
      EXPERIMENT_TRANSPORT: ${{ inputs.transport }}
      EXPERIMENT_IMAGE: eal-api-experiment:${{ github.run_id }}-${{ github.run_attempt }}
      EXPERIMENT_CONTAINER: eal-api-experiment-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the complete experiment image
        run: docker build --file experiments/api_load_test/Dockerfile --tag "$EXPERIMENT_IMAGE" .
      - name: Record the tested revision and container
        run: |
          mkdir -p experiment-results
          git rev-parse HEAD > experiment-results/source-commit.txt
          docker image inspect "$EXPERIMENT_IMAGE" > experiment-results/image-inspect.json
      - name: Run tests and HTTP/MCP controls in Docker
        run: docker run --rm --network none "$EXPERIMENT_IMAGE"
      - name: Run the selected calibration or development suite in Docker
        env:
          OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_TOKEN }}
        run: |
          model_args=()
          if [ "$EXPERIMENT_MODEL" != all ]; then
            model_args=(--model "$EXPERIMENT_MODEL")
          fi
          # The value is inherited from the environment, not placed in argv or an image layer.
          docker run --rm --name "$EXPERIMENT_CONTAINER" --user "$(id -u):$(id -g)" \
            --env OPENAI_API_TOKEN --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env EAL_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            --volume "$PWD/experiment-results:/results" \
            "$EXPERIMENT_IMAGE" \
            python -m experiments.api_load_test run --mode "$EXPERIMENT_MODE" \
              --transport "$EXPERIMENT_TRANSPORT" --finalisation "$EXPERIMENT_FINALISATION" "${model_args[@]}" --output /results/run
      - name: Stop this invocation's paid container
        id: stop_paid
        if: always()
        run: |
          if docker container inspect "$EXPERIMENT_CONTAINER" > /dev/null 2>&1; then
            docker rm --force "$EXPERIMENT_CONTAINER"
          fi
      - name: Recover an interrupted experiment summary without model calls
        if: always() && steps.stop_paid.outcome == 'success'
        run: |
          if [ -f experiment-results/run/manifest.json ] && [ ! -f experiment-results/run/summary.md ]; then
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --volume "$PWD/experiment-results:/results" \
              "$EXPERIMENT_IMAGE" \
              python -m experiments.api_load_test analyse --output /results/run
          fi
      - name: Publish the measured summary
        if: always()
        run: |
          if [ -f experiment-results/run/summary.md ]; then
            cat experiment-results/run/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The experiment did not reach a measured summary. Inspect the retained logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain assignments, calls, measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiment-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Remove this job's image
        if: always()
        run: docker image rm "$EXPERIMENT_IMAGE" || true
