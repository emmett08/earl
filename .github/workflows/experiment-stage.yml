name: EAL experiment stage
on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
      stage_name:
        type: string
        required: true
      operation:
        type: string
        default: start
      plan:
        type: string
        default: comparison
      plan_path:
        type: string
        default: ''
      source_artifact_id:
        type: string
        default: ''
      annotation_labels:
        type: string
        default: ''
      information_config:
        type: string
        default: ''
      workers:
        type: number
        default: 0
    secrets:
      OPENAI_API_KEY:
        required: false
    outputs:
      artifact_id:
        description: Cumulative retained data or the frozen preflight plan
        value: ${{ jobs.stage.outputs.artifact_id }}
      can_collect:
        description: True only when another bounded collection job is appropriate
        value: ${{ jobs.stage.outputs.can_collect }}
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      can_collect: ${{ steps.execute.outputs.can_collect }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install the pinned experiment runtime
        run: python -m pip install -c experiments/model_transfer/requirements.lock -e .
      - name: Execute the ordered stage
        id: execute
        env:
          PIPELINE_PHASE: ${{ inputs.phase }}
          PIPELINE_OPERATION: ${{ inputs.operation }}
          TRANSFER_PLAN: ${{ inputs.plan }}
          PLAN_PATH: ${{ inputs.plan_path }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          ANNOTATION_LABELS: ${{ inputs.annotation_labels }}
          INFORMATION_CONFIG: ${{ inputs.information_config }}
          EXPERIMENT_WORKERS: ${{ inputs.workers }}
          OPENAI_API_KEY: ${{ inputs.phase == 'collect' && secrets.OPENAI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.experiment_pipeline "$PIPELINE_PHASE"
      - name: Retain this cumulative stage even after a failure
        id: retain
        if: ${{ always() && steps.execute.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiment-${{ inputs.stage_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.execute.outputs.artifact_path }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Retain calibration and scripted rehearsal records
        if: ${{ always() && inputs.phase == 'prepare' && inputs.operation != 'resume' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiment-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/model_transfer/runs/preflight
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Export only masked answer text for the independent assessor
        id: masked
        if: ${{ success() && inputs.phase == 'export' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiment-annotations-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/model_transfer/runs/live/annotation-bundle/items.json
          if-no-files-found: warn
          retention-days: 90
      - name: Explain the result and the next required input
        if: ${{ always() && steps.execute.outputs.artifact_path != '' }}
        env:
          PIPELINE_ARTIFACT_PATH: ${{ steps.execute.outputs.artifact_path }}
          PIPELINE_ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          ANNOTATION_ARTIFACT_ID: ${{ steps.masked.outputs.artifact-id }}
        run: python -m scripts.experiment_pipeline summary
