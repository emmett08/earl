name: Architecture extension v3 feasibility study

on:
  pull_request:
    paths:
      - .github/workflows/architecture-extension-v3.yml
      - experiments/architecture_extension_v3/**
      - experiments/architecture_extension_v2/results/snapshots/a/**
      - src/eal/**
      - grammar/**
      - pyproject.toml
  workflow_dispatch:
    inputs:
      live:
        description: 'Run six B-C-D coding clones with provider credentials; false validates frozen apparatus only.'
        type: boolean
        default: false
      model_blocks:
        description: 'JSON array of complete blocks. Each B/C/D class and model is identical across its P0/P1/P2 arms.'
        type: string
        default: '[{"id":"sandbox-repair","b_class":"codex_cli","c_class":"codex_cli","d_class":"codex_cli","b_model":"gpt-6-sol","c_model":"gpt-6-sol","d_model":"gpt-6-sol","b_effort":"medium","c_effort":"medium","d_effort":"medium"}]'
      codex_version:
        description: 'Exact @openai/codex npm version'
        type: string
        default: '0.154.0'
      claude_version:
        description: 'Exact @anthropic-ai/claude-code npm version'
        type: string
        default: '2.1.283'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install frozen EAL dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify pre-run input freeze and deterministic collectors
        run: |
          python experiments/architecture_extension_v3/study/freeze.py verify
          python -m pytest tests/test_eal2_frontend.py tests/test_aspic_compiler.py
          python -m pytest experiments/architecture_extension_v3/technical_debt/test_tool.py experiments/architecture_extension_v3/test_workflow_ledger.py experiments/architecture_extension_v3/release_gate/test_gate.py
          python -m pytest experiments/architecture_extension_v3/test_host.py experiments/architecture_extension_v3/study/test_study_contract.py experiments/architecture_extension_v3/study/test_assembly.py
      - name: Replay the finite release decision gate without altering frozen results
        run: |
          gate=experiments/architecture_extension_v3/release_gate
          python "$gate/run.py" --output "$RUNNER_TEMP/release-gate-replay.json" > "$RUNNER_TEMP/release-gate-summary.json"
          python - <<'PYGATE'
          import hashlib,json
          from pathlib import Path
          gate=Path('experiments/architecture_extension_v3/release_gate')
          old=json.loads((gate/'results.json').read_text())
          new=json.loads((Path(__import__('os').environ['RUNNER_TEMP'])/'release-gate-replay.json').read_text())
          for key,path in (('source_sha256',gate/'argument.eal'),('registry_sha256',gate/'eal-tools.toml')):
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert old[key]==new[key]==digest
          fields=('case_id','plain_action','eal_action','candidate_aspic_status',
                  'claim_status','evidence_status','collection_errors')
          project=lambda report:[{key:item[key] for key in fields} for item in report['cases']]
          assert old['schema']==new['schema']=='refund-release-gate-apparatus/1'
          assert old['all_agree'] is new['all_agree'] is True
          assert project(old)==project(new)
          attacked=next(item for item in new['cases'] if item['case_id']=='applied_unreconciled')
          assert any(defeat['kind']=='undercut' for defeat in attacked['aspic_defeats'])
          PYGATE
          python experiments/architecture_extension_v3/study/freeze.py verify
      - name: Exercise P1 plain collector and P2 EAL MCP against the same A snapshot
        run: |
          source=experiments/architecture_extension_v2/results/snapshots/a
          study=experiments/architecture_extension_v3
          python "$study/host.py" assess --baseline "$source" --candidate "$source" --family R --feature B --arm P1 --state-dir "$RUNNER_TEMP/p1"
          python "$study/host.py" assess --baseline "$source" --candidate "$source" --family R --feature B --arm P2 --state-dir "$RUNNER_TEMP/p2"
          python "$study/host.py" prepare --source "$source" --brief "$study/study/features/R-B.md" --family R --feature B --arm P2 --packet "$RUNNER_TEMP/p2/packet-P2.json" --destination "$RUNNER_TEMP/trial" --record "$RUNNER_TEMP/exposure.json"
          python "$study/host.py" verify-exposure --trial "$RUNNER_TEMP/trial" --record "$RUNNER_TEMP/exposure.json"
          python "$study/study/assess.py" --candidate "$source" --family R --stage B > "$RUNNER_TEMP/baseline-assessment.json"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install pinned Codex for a credential-free sandbox probe
        env:
          CODEX_VERSION: ${{ inputs.codex_version || '0.154.0' }}
        run: npm install -g "@openai/codex@$CODEX_VERSION"
      - name: Verify Codex sandbox before enabling live acquisition
        run: |
          timeout --signal=TERM --kill-after=5s 45s codex -c 'sandbox_mode="workspace-write"' \
            -c features.use_legacy_landlock=true sandbox -- \
            python3 -c 'from pathlib import Path; p=Path(".sandbox-probe"); p.write_text("ok"); assert p.read_text()=="ok"; p.unlink(); print("Sandbox read/write succeeded")'
      - name: Retain deterministic preflight, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-architecture-v3-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p1/
            ${{ runner.temp }}/p2/
            ${{ runner.temp }}/trial/
            ${{ runner.temp }}/exposure.json
            ${{ runner.temp }}/baseline-assessment.json
            ${{ runner.temp }}/release-gate-replay.json
            ${{ runner.temp }}/release-gate-summary.json
          if-no-files-found: warn
          retention-days: 30

  live_config:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live && needs.validate.result == 'success' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.matrix.outputs.episodes }}
      block_id: ${{ steps.matrix.outputs.block_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate model blocks and frozen random clone assignment
        id: matrix
        env:
          BLOCKS: ${{ inputs.model_blocks }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          CLAUDE_VERSION: ${{ inputs.claude_version }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python experiments/architecture_extension_v3/study/freeze.py verify
          python - <<'PYCONFIG'
          import json, os, re
          from pathlib import Path
          blocks = json.loads(os.environ['BLOCKS'])
          assert isinstance(blocks, list) and len(blocks) == 1
          expected = {'id'} | {f'{stage}_{field}' for stage in 'bcd' for field in ('class','model','effort')}
          ids = set()
          for block in blocks:
              assert isinstance(block, dict) and set(block) == expected
              assert re.fullmatch(r'[A-Za-z0-9_-]{1,30}', block['id']) and block['id'] not in ids
              ids.add(block['id'])
              for stage in 'bcd':
                  klass = block[f'{stage}_class']
                  assert klass in {'codex_cli','claude_cli'}
                  assert re.fullmatch(r'[A-Za-z0-9_.-]{1,80}', block[f'{stage}_model'])
                  assert block[f'{stage}_effort'] in {'low','medium','high','xhigh'}
                  key = 'OPENAI_API_KEY' if klass == 'codex_cli' else 'ANTHROPIC_API_KEY'
                  assert os.environ[key], f'{key} is required for {stage.upper()}'
          for name in ('CODEX_VERSION','CLAUDE_VERSION'):
              assert re.fullmatch(r'\d+\.\d+\.\d+', os.environ[name])
          allocation = json.loads(Path('experiments/architecture_extension_v3/study/allocation.json').read_text())
          assigned = allocation['family_clone_assignment']
          episodes = [{'block': block, 'family': family, 'clone': clone, 'arm': arm}
                      for block in blocks for family in ('R','W')
                      for clone, arm in sorted(assigned[family].items())]
          assert len(episodes) == 6 * len(blocks)
          manifest={'schema':'architecture-v3-dispatch-block/1','block':blocks[0],
                    'codex_version':os.environ['CODEX_VERSION'],
                    'claude_version':os.environ['CLAUDE_VERSION'],
                    'source_commit':os.environ['GITHUB_SHA'],
                    'run_id':os.environ['GITHUB_RUN_ID'],
                    'run_attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          Path(os.environ['RUNNER_TEMP'],'block-manifest.json').write_text(
              json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('episodes=' + json.dumps({'include': episodes}, separators=(',',':')), file=output)
              print('block_id=' + blocks[0]['id'], file=output)
          PYCONFIG
      - name: Retain the predeclared model and class block
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-architecture-v3-block-${{ github.run_id }}
          path: ${{ runner.temp }}/block-manifest.json
          if-no-files-found: error
          retention-days: 30

  prepare_b:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live && needs.live_config.result == 'success' }}
    needs: live_config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.live_config.outputs.episodes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Acquire current-source packet, then stage only current brief and trial
        env:
          FAMILY: ${{ matrix.family }}
          ARM: ${{ matrix.arm }}
          CLONE: ${{ matrix.clone }}
        run: |
          python experiments/architecture_extension_v3/study/freeze.py verify
          source=experiments/architecture_extension_v2/results/snapshots/a
          study=experiments/architecture_extension_v3
          mkdir -p "$RUNNER_TEMP/input-B" "$RUNNER_TEMP/host-pre-B"
          packet=()
          if [ "$ARM" != P0 ]; then
            python "$study/host.py" assess --baseline "$source" --candidate "$source" --family "$FAMILY" --feature B --arm "$ARM" --state-dir "$RUNNER_TEMP/host-pre-B/state"
            packet=(--packet "$RUNNER_TEMP/host-pre-B/state/packet-$ARM.json")
          fi
          python "$study/host.py" prepare --source "$source" --brief "$study/study/features/$FAMILY-B.md" --family "$FAMILY" --feature B --arm "$ARM" "${packet[@]}" --destination "$RUNNER_TEMP/input-B/trial" --record "$RUNNER_TEMP/input-B/exposure.json"
          python "$study/host.py" verify-exposure --trial "$RUNNER_TEMP/input-B/trial" --record "$RUNNER_TEMP/input-B/exposure.json"
          python - <<'PYB'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'host-pre-B'/'assignment.json'
          p.write_text(json.dumps({'schema':'architecture-v3-assignment/1','family':os.environ['FAMILY'],
             'clone':os.environ['CLONE'],'arm':os.environ['ARM'],'source_commit':os.environ['GITHUB_SHA'],
             'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT']},sort_keys=True)+'\n')
          PYB
      - name: Deliver B coding input only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-input-B-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ runner.temp }}/input-B/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain host preflight separately
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-host-pre-B-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ runner.temp }}/host-pre-B/
          if-no-files-found: warn
          retention-days: 30

  code_B:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live && needs.live_config.result == 'success' }}
    needs: [live_config, prepare_b]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.live_config.outputs.episodes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download only this clone's current episode input (no repository checkout)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: attempt-${{ github.run_attempt }}-input-B-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ github.workspace }}
      - name: Check isolated exposure before agent
        run: |
          test -f trial/FEATURE.md
          test -f trial/AGENTS.md
          test -f exposure.json
          python - <<'PYINPUT'
          from pathlib import Path
          visible={p.name for p in Path('.').iterdir()}
          assert visible=={'trial','exposure.json'}, visible
          trial=Path('trial')
          for path in trial.rglob('*'):
              assert not path.is_symlink()
              assert path.name not in {'assess.py','freeze.py','task-bank.json'}
              assert 'study' not in path.parts
          PYINPUT
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install exact agent class binary
        env:
          CLASS: ${{ matrix.block.b_class }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          if [ "$CLASS" = codex_cli ]; then
            npm install -g "@openai/codex@$CODEX_VERSION"
            codex --version > "$GITHUB_WORKSPACE/agent-version.txt"
            sha256sum "$(readlink -f "$(command -v codex)")" > "$GITHUB_WORKSPACE/agent-binary-sha256.txt"
          else
            npm install -g "@anthropic-ai/claude-code@$CLAUDE_VERSION"
            claude --version > "$GITHUB_WORKSPACE/agent-version.txt"
            sha256sum "$(readlink -f "$(command -v claude)")" > "$GITHUB_WORKSPACE/agent-binary-sha256.txt"
          fi
      - name: Verify Codex sandbox before spending model tokens
        id: sandbox
        if: ${{ matrix.block.b_class == 'codex_cli' }}
        working-directory: trial
        run: |
          timeout --signal=TERM --kill-after=5s 45s codex -c 'sandbox_mode="workspace-write"' \
            -c features.use_legacy_landlock=true sandbox -- \
            python3 -c 'from pathlib import Path; p=Path(".sandbox-probe"); p.write_text("ok"); assert p.read_text()=="ok"; p.unlink(); print("Sandbox read/write succeeded")'
      - name: Implement current requirement with Codex CLI
        id: codex
        if: ${{ matrix.block.b_class == 'codex_cli' }}
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ matrix.block.b_model }}
          EFFORT: ${{ matrix.block.b_effort }}
        run: |
          cd trial
          date +%s.%N > "$GITHUB_WORKSPACE/agent-start.txt"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            codex -c features.use_legacy_landlock=true exec --skip-git-repo-check --ephemeral --json \
            --sandbox workspace-write --model "$MODEL" \
            -c "model_reasoning_effort=$EFFORT" - \
            < FEATURE.md > "$GITHUB_WORKSPACE/agent.jsonl" 2> "$GITHUB_WORKSPACE/agent.stderr"
          status=$?
          set -e
          date +%s.%N > "$GITHUB_WORKSPACE/agent-end.txt"
          echo "$status" > "$GITHUB_WORKSPACE/agent-exit.txt"
          exit "$status"
      - name: Implement current requirement with Claude Code CLI
        id: claude
        if: ${{ matrix.block.b_class == 'claude_cli' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ matrix.block.b_model }}
          EFFORT: ${{ matrix.block.b_effort }}
        run: |
          cd trial
          date +%s.%N > "$GITHUB_WORKSPACE/agent-start.txt"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            claude --bare --restricted -p --no-session-persistence \
            --permission-mode acceptEdits --permission-prompts none \
            --tools Read,Edit,Write,Glob,Grep --disallowedTools 'mcp__*' \
            --append-system-prompt-file AGENTS.md \
            --model "$MODEL" --effort "$EFFORT" \
            --output-format stream-json --verbose \
            < FEATURE.md > "$GITHUB_WORKSPACE/agent.jsonl" 2> "$GITHUB_WORKSPACE/agent.stderr"
          status=$?
          set -e
          date +%s.%N > "$GITHUB_WORKSPACE/agent-end.txt"
          echo "$status" > "$GITHUB_WORKSPACE/agent-exit.txt"
          exit "$status"
      - name: Record invocation and redact exact credentials from retained outputs
        if: always()
        env:
          AGENT_CLASS: ${{ matrix.block.b_class }}
          REQUESTED_MODEL: ${{ matrix.block.b_model }}
          SANDBOX_PREFLIGHT: ${{ steps.sandbox.outcome }}
          REQUESTED_EFFORT: ${{ matrix.block.b_effort }}
          FAMILY: ${{ matrix.family }}
          CLONE: ${{ matrix.clone }}
          ARM: ${{ matrix.arm }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PYMETA'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          def read(name):
              p=root/name
              return p.read_text().strip() if p.exists() else None
          start,end=read('agent-start.txt'),read('agent-end.txt')
          elapsed=max(0.0,float(end)-float(start)) if start and end else None
          trace=root/'agent.jsonl'
          raw_sha=hashlib.sha256(trace.read_bytes()).hexdigest() if trace.exists() else None
          exposed=False
          for path in root.rglob('*'):
              if not path.is_file() or path.is_symlink(): continue
              raw=path.read_bytes()
              replaced=raw
              for name in ('OPENAI_API_KEY','ANTHROPIC_API_KEY'):
                  secret=os.environ[name].encode()
                  if secret and secret in replaced:
                      replaced=replaced.replace(secret,b'[REDACTED_PROVIDER_CREDENTIAL]')
              if replaced!=raw:
                  path.write_bytes(replaced); exposed=True
          record={'schema':'architecture-v3-agent-invocation/1',
              'family':os.environ['FAMILY'],'clone':os.environ['CLONE'],'arm':os.environ['ARM'],
              'stage':'B','agent_class':os.environ['AGENT_CLASS'],
              'requested_model':os.environ['REQUESTED_MODEL'],
              'requested_effort':os.environ['REQUESTED_EFFORT'],
              'cli_version':read('agent-version.txt'),'binary_sha256':(read('agent-binary-sha256.txt') or '').split()[0] or None,
              'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH'],
              'started_unix_seconds':float(start) if start else None,
              'ended_unix_seconds':float(end) if end else None,'wall_seconds':elapsed,
              'wall_cap_seconds':1800,'exit_code':int(read('agent-exit.txt')) if read('agent-exit.txt') else None,
              'sandbox_backend':'legacy-landlock' if os.environ['AGENT_CLASS']=='codex_cli' else None,
              'sandbox_preflight':os.environ['SANDBOX_PREFLIGHT'],
              'raw_trace_sha256_before_secret_redaction':raw_sha,
              'exact_credential_redacted':exposed}
          (root/'invocation.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          PYMETA
      - name: Retain complete coding attempt, including failed invocations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-episode-B-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ github.workspace }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Mark failed model attempt after preserving artefact
        if: ${{ (matrix.block.b_class == 'codex_cli' && steps.codex.outcome != 'success') || (matrix.block.b_class == 'claude_cli' && steps.claude.outcome != 'success') }}
        run: exit 1

  host_B:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live && needs.live_config.result == 'success' }}
    needs: [live_config, code_B]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.live_config.outputs.episodes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Retrieve assigned attempt after coding job has ended
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: attempt-${{ github.run_attempt }}-episode-B-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ runner.temp }}/episode
      - name: Verify exact exposure, capture source-only snapshot and sealed independent result
        env:
          FAMILY: ${{ matrix.family }}
          ARM: ${{ matrix.arm }}
          CLONE: ${{ matrix.clone }}
        run: |
          python experiments/architecture_extension_v3/study/freeze.py verify
          study=experiments/architecture_extension_v3
          mkdir -p "$RUNNER_TEMP/host-B" "$RUNNER_TEMP/input-C/"
          set +e
          python "$study/host.py" verify-exposure --trial "$RUNNER_TEMP/episode/trial" --record "$RUNNER_TEMP/episode/exposure.json" > "$RUNNER_TEMP/host-B/exposure-verification.json" 2> "$RUNNER_TEMP/host-B/exposure-error.txt"
          echo "$?" > "$RUNNER_TEMP/host-B/exposure-exit.txt"
          set -e
          set +e
          python "$study/workflow_ledger.py" --trace "$RUNNER_TEMP/episode/agent.jsonl" --invocation "$RUNNER_TEMP/episode/invocation.json" --output "$RUNNER_TEMP/host-B/ledger.json" > "$RUNNER_TEMP/host-B/ledger-summary.json" 2> "$RUNNER_TEMP/host-B/ledger-error.txt"
          echo "$?" > "$RUNNER_TEMP/host-B/ledger-exit.txt"
          set -e
          python "$study/host.py" snapshot --trial "$RUNNER_TEMP/episode/trial" --record "$RUNNER_TEMP/episode/exposure.json" --destination "$RUNNER_TEMP/host-B/source" --manifest "$RUNNER_TEMP/host-B/code-manifest.json"
          python "$study/study/assess.py" --candidate "$RUNNER_TEMP/host-B/source" --family "$FAMILY" --stage B > "$RUNNER_TEMP/host-B/assessment.json"
          packet=()
          if [ "$ARM" != P0 ]; then
            python "$study/host.py" assess --baseline experiments/architecture_extension_v2/results/snapshots/a --candidate "$RUNNER_TEMP/host-B/source" --family "$FAMILY" --feature C --arm "$ARM" --state-dir "$RUNNER_TEMP/host-B/next-state"
