          mkdir -p "$RUNNER_TEMP/host-D"
          set +e
          python "$study/host.py" verify-exposure --trial "$RUNNER_TEMP/episode/trial" --record "$RUNNER_TEMP/episode/exposure.json" > "$RUNNER_TEMP/host-D/exposure-verification.json" 2> "$RUNNER_TEMP/host-D/exposure-error.txt"
          echo "$?" > "$RUNNER_TEMP/host-D/exposure-exit.txt"
          set -e
          set +e
          python "$study/workflow_ledger.py" --trace "$RUNNER_TEMP/episode/agent.jsonl" --invocation "$RUNNER_TEMP/episode/invocation.json" --output "$RUNNER_TEMP/host-D/ledger.json" > "$RUNNER_TEMP/host-D/ledger-summary.json" 2> "$RUNNER_TEMP/host-D/ledger-error.txt"
          echo "$?" > "$RUNNER_TEMP/host-D/ledger-exit.txt"
          set -e
          python "$study/host.py" snapshot --trial "$RUNNER_TEMP/episode/trial" --record "$RUNNER_TEMP/episode/exposure.json" --destination "$RUNNER_TEMP/host-D/source" --manifest "$RUNNER_TEMP/host-D/code-manifest.json"
          python "$study/study/assess.py" --candidate "$RUNNER_TEMP/host-D/source" --family "$FAMILY" --stage D > "$RUNNER_TEMP/host-D/assessment.json"

      - name: Retain full host result and sealed assessment
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-host-D-${{ matrix.block.id }}-${{ matrix.clone }}
          path: ${{ runner.temp }}/host-D/
          if-no-files-found: warn
          retention-days: 30

  compare:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live && needs.live_config.result == 'success' }}
    needs: [live_config, host_B, host_C, host_D]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: attempt-${{ github.run_attempt }}-architecture-v3-block-${{ github.run_id }}
          path: ${{ runner.temp }}/config
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attempt-${{ github.run_attempt }}-episode-*
          path: ${{ runner.temp }}/episodes
        continue-on-error: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attempt-${{ github.run_attempt }}-host-B-*
          path: ${{ runner.temp }}/hosts
        continue-on-error: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attempt-${{ github.run_attempt }}-host-C-*
          path: ${{ runner.temp }}/hosts
        continue-on-error: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attempt-${{ github.run_attempt }}-host-D-*
          path: ${{ runner.temp }}/hosts
        continue-on-error: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attempt-${{ github.run_attempt }}-host-pre-B-*
          path: ${{ runner.temp }}/preflight
        continue-on-error: true
      - name: Assemble exact episode ledger and run bounded analysis
        env:
          BLOCK_ID: ${{ needs.live_config.outputs.block_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          set +e
          python experiments/architecture_extension_v3/study/assemble.py \
            --episodes "$RUNNER_TEMP/episodes" --hosts "$RUNNER_TEMP/hosts" \
            --preflight "$RUNNER_TEMP/preflight" --block-id "$BLOCK_ID" \
            --block-manifest "$RUNNER_TEMP/config/block-manifest.json" \
            --output "$RUNNER_TEMP/comparison/ledger.json" \
            > "$RUNNER_TEMP/comparison/assembly-summary.json" \
            2> "$RUNNER_TEMP/comparison/assembly-error.txt"
          code=$?
          echo "$code" > "$RUNNER_TEMP/comparison/assembly-exit.txt"
          if [ "$code" = 0 ]; then
            python experiments/architecture_extension_v3/study/analyse.py \
              "$RUNNER_TEMP/comparison/ledger.json" \
              > "$RUNNER_TEMP/comparison/analysis.json" \
              2> "$RUNNER_TEMP/comparison/analysis-error.txt"
            echo "$?" > "$RUNNER_TEMP/comparison/analysis-exit.txt"
          fi
          set -e
          cat "$RUNNER_TEMP/comparison/assembly-summary.json"
          cat "$RUNNER_TEMP/comparison/assembly-error.txt"
          if [ -f "$RUNNER_TEMP/comparison/ledger.json" ]; then
            python - <<'PYDIAGNOSTICS'
          import json, os
          from pathlib import Path
          ledger=json.loads((Path(os.environ['RUNNER_TEMP'])/'comparison/ledger.json').read_text())
          for row in ledger.get('missing_or_invalid', []):
              print(f"{row['clone']} {row['stage']}: {row['error']}")
          PYDIAGNOSTICS
          fi
          if [ -s "$RUNNER_TEMP/comparison/analysis-error.txt" ]; then
            cat "$RUNNER_TEMP/comparison/analysis-error.txt"
          fi
          echo 'The masked architecture review remains unresolved; any 25% judgement is withheld.'
      - name: Retain complete or partial comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attempt-${{ github.run_attempt }}-architecture-v3-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: warn
          retention-days: 30
      - name: Mark incomplete acquisition or invalid analysis after retention
        run: |
          test "$(cat "$RUNNER_TEMP/comparison/assembly-exit.txt")" = 0
          test "$(cat "$RUNNER_TEMP/comparison/analysis-exit.txt")" = 0
