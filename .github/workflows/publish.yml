name: EAL package release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag; dispatch this workflow on the same tag'
        type: string
        required: true
        default: v3.2.1
      destination:
        description: 'Verify artefacts, or publish the verified artefacts to the selected index'
        type: choice
        options: [verify, testpypi, pypi]
        default: verify

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.release_tag }}-${{ inputs.destination }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Resolve the matching tag to an immutable commit on main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: >-
          python scripts/check_release_tag.py "$RELEASE_TAG"
          --dispatch-ref "$DISPATCH_REF" --dispatch-sha "$DISPATCH_SHA"
          --github-output "$GITHUB_OUTPUT"

  full-check:
    name: Verify parser, tests and maintained example
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install constrained package and test dependencies
        run: python -m pip install -c experiments/model_transfer/requirements.lock '.[dev,release]'
      - name: Check parser, scientific contracts, tests and maintained example
        run: make check PYTHON=python

  build:
    name: Build one wheel and source distribution
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install package and release tools
        run: python -m pip install -c experiments/model_transfer/requirements.lock '.[release]'
      - name: Build and check distribution metadata
        run: |
          make build PYTHON=python
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - name: Retain immutable distributions and their checksums
        id: distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  installed-package:
    name: Installed package (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [resolve, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: macos-14, python: '3.12'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Retrieve the exact built distributions from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifacts
      - name: Check distribution bytes
        working-directory: release-artifacts
        run: shasum -a 256 --check SHA256SUMS
      - name: Install each distribution outside the checkout and exercise the public interfaces
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: >-
          python scripts/check_distribution.py release-artifacts/dist
          --expected-version "$RELEASE_VERSION"

  publish-testpypi:
    name: Publish verified distributions to TestPyPI
    if: ${{ inputs.destination == 'testpypi' }}
    needs: [resolve, full-check, build, installed-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/engineering-argument-language
    permissions:
      id-token: write
    steps:
      - name: Retrieve the exact verified distributions from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Check distribution bytes before publication
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish through the TestPyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    name: Publish verified distributions to PyPI
    if: ${{ inputs.destination == 'pypi' }}
    needs: [resolve, full-check, build, installed-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi.org
      url: https://pypi.org/p/engineering-argument-language
    permissions:
      contents: read
    steps:
      - name: Retrieve the exact verified distributions from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Check distribution bytes before publication
        run: sha256sum --check --strict SHA256SUMS
      - name: Check the production upload token is configured
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo '::error::PYPI_TOKEN is required in the pypi.org environment.'
            exit 1
          fi
      - name: Publish through the PyPI environment token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          attestations: false
