name: EAL verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install package and test dependencies
        run: python -m pip install -c experiments/model_transfer/requirements.lock -e '.[dev]'
      - name: Check parser, scientific contracts, tests and maintained example
        run: make check
      - name: Build distribution
        run: make build
