name: EAL inference machinery fact-parity pilot

on:
  push:
    branches:
      - study/architecture-v4-3-live
    paths:
      - .github/workflows/inference-machinery-v1-1.yml
      - experiments/inference_machinery_v1_1/**
      - src/eal/**
  workflow_dispatch:
    inputs:
      live:
        description: 'Make two paid gpt-5.4-nano requests after offline validation.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q experiments/inference_machinery_v1_1/test_inference.py
      - run: python experiments/inference_machinery_v1_1/run.py prepare --output "$RUNNER_TEMP/inference-offline"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: inference-v1-1-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-offline/
          if-no-files-found: warn
          retention-days: 90

  paid_pilot:
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Run inference machinery pilot v1.1')) && needs.validate.result == 'success' && github.run_attempt == 1 }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Execute exactly one fresh model session per arm
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: python experiments/inference_machinery_v1_1/run.py live --live --output "$RUNNER_TEMP/inference-live"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: inference-v1-1-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-live/
          if-no-files-found: warn
          retention-days: 90
