# Rates checked against the official model page on 2026-09-23.
# Estimates exclude host infrastructure, labour and taxes.
[provider]
kind = "chat_completions"
model = "gpt-4.1-nano-2025-04-14"
api_key_env = "OPENAI_API_KEY"

[provider.sampling]
temperature = 0

[provider.pricing]
input_usd_per_million = 0.1
cached_input_usd_per_million = 0.025
output_usd_per_million = 0.4

[budget]
max_iterations = 10
max_repairs = 4
max_total_tokens = 120000
max_elapsed_seconds = 120
max_model_cost_usd = 0.025
