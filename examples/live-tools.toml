[tools.inspect_input]
kind = "command"
argv = ["python3", "examples/local_tool.py", "inspect"]
version = "1"
mode = "deterministic"
timeout_seconds = 5
max_output_bytes = 4096

[tools.benchmark]
kind = "command"
argv = ["python3", "examples/local_tool.py", "measure"]
version = "1"
mode = "nondeterministic"
timeout_seconds = 10
max_output_bytes = 4096
