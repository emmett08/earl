# Use with eal.providers.load_provider and eal.recipient.run_reviewed_recipient.
# The launcher supplies an exact reviewed question, recipient-only MCP server,
# authenticated principal and grants. This file does not store a credential.
[provider]
kind = "responses"
model = "SET_EXPLICIT_MODEL_VERSION"
endpoint = "https://api.openai.com/v1/responses"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60
max_response_bytes = 1048576

[provider.capabilities]
native_tools = true
reasoning_effort = "medium"
structured_output = "none"

# Configure rates for the exact model and service tier before applying a
# monetary budget. Usage and unknown cost remain separate in reports.
