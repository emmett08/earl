[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-argument-language"
version = "2.2.1"
description = "An ANTLR4 language and MCP interpreter for engineering reasoning and argumentation"
requires-python = ">=3.11"
dependencies = ["antlr4-python3-runtime==4.13.2", "mcp==1.30.0", "jsonschema>=4.23,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
socks = ["httpx[socks]>=0.28,<1"]

[project.scripts]
eal = "eal.cli:main"
eal-mcp = "eal.server:main"
eal-host = "eal.host:main"
eal-agent = "eal.agent:main"
eal-benchmark = "eal.benchmark:main"
eal-experiment = "eal.experiment:main"
eal-relay = "eal.relay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
