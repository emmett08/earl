[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-argument-language"
version = "2.18.0"
description = "An ANTLR4 language and MCP interpreter for engineering reasoning and argumentation"
requires-python = ">=3.11"
dependencies = ["antlr4-python3-runtime==4.13.2", "mcp==1.30.0", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
aspic-reference = ["python-argumentation==2.0.2"]

[project.scripts]
eal = "eal.cli:main"
eal-mcp = "eal.server:main"
eal-host = "eal.host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
